services:
 mysql:
  image: mysql:8.4
  container_name: microtwo-mysql
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  ports:
    - "3307:3306"
  volumes:
    - mysql-data:/var/lib/mysql
    - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 10s
    timeout: 5s
    retries: 15
 employee-service:
  build: ./employee-service
  container_name: emp-conatiner
  ports:
   - "8082:8082"
  environment:
   SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_db
   SPRING_DATASOURCE_USERNAME: root
   SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  depends_on:
   mysql:
    condition: service_healthy
   kafka:
    condition: service_healthy
 department-service:
  build: ./department-service
  container_name: dept-conatiner
  ports:
   - "8081:8081"
  environment:
   SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/department_db
   SPRING_DATASOURCE_USERNAME: root
   SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
   SPRING_KAFKA_CONSUMER_GROUP_ID: department-group
  depends_on:
   employee-service:
    condition: service_started
   mysql:
    condition: service_healthy
   kafka:
        condition: service_healthy
 kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    
volumes:
 mysql-data:
 kafka-data:
  