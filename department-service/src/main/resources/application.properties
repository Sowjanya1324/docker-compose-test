spring.application.name=department-service
server.port=8081


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/department_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.config.import=optional:configserver:http://localhost:8888

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:department-group}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.dailycode.department_service.controller.dto
spring.kafka.consumer.properties[spring.json.value.default.type]=com.dailycode.department_service.controller.dto.Employee
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

